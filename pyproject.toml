[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scheduler-agent"
version = "0.1.0"
description = "模型驱动的素材审核与发布排期 CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
scheduler-agent = "scheduler_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scheduler_agent = ["data/*.json"]
